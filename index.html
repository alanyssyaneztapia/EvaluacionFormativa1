<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PruebaFormativa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <table class="tabla">
        <thead>
            <tr>
                <h1 class="titulo"> Inicio de sesión</h1>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nombre: </td>
                <td><input id="nombre" type="text" name="nombre" placeholder="ingrese nombre "> </td>
            </tr>
            <tr>
                <td>Apellido: </td>
                <td><input id="apellido" type="text" name="apellido" placeholder="ingrese apellido "> </td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input id="email" type="email" name="email" placeholder="ingrese email "> </td>
            </tr>

            <tr>
                <td>Contraseña:</td>
                <td><input id="contraseña" type="password" name="contraseña" placeholder="ingrese contraseña "> </td>
            </tr>
            <tr>
                <td>
                    <div class="boton">
                    <input type="submit" value="Iniciar sesión" id="Resultado" onclick="validarFormulario()">

                    </div>
                </td>
            <td>
                <img src="https://i.pinimg.com/736x/e7/eb/07/e7eb0747f18544236e99abcfb14a715e.jpg" height="" width="40" alt="Imagen de inicio de sesión">
            </td>
            <tr>
                </td>

            </tr>
         

            </tr>
        </tbody>

    </table>
    <script src="funciones.js"></script>
</body>
</html>
